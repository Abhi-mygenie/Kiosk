name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'kiosk-native/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'kiosk-native/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk-native/KioskApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kiosk-native/KioskApp/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install Node dependencies
        run: npm install

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KioskApp-release
          path: kiosk-native/KioskApp/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload APK (unsigned) if release fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KioskApp-unsigned
          path: kiosk-native/KioskApp/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
